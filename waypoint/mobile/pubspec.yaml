name: wanees
description: Wanees (ونيس) — carpooling and ride sharing for Syria.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: any
  flutter_stripe: ^11.4.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

# App icon: regenerate the PNGs with `python3 tool/make_icon.py`, then
# apply them with `dart run flutter_launcher_icons` (done by CI and make mobile-bootstrap).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B6E99"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
