# EchoScope CI – runs only for the EchoScope branch (main holds a different app).
name: EchoScope CI

on:
  push:
    branches: [ccr-3d642cc4-debefn]
  pull_request:
    branches: [ccr-3d642cc4-debefn]
  workflow_dispatch:

concurrency:
  group: echoscope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, Robolectric and screenshot tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Release build (R8, unsigned)
        run: ./gradlew --no-daemon assembleRelease

      # Licence gate for a future commercial build. Today it is expected to report restricted media,
      # so it is informational only (see FUTURE_COMMERCIAL_MIGRATION.md).
      - name: Commercial media gate (report only)
        continue-on-error: true
        run: python3 scripts/check_commercial_assets.py --apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoscope-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/cockpit-screens/
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: echoscope-apks
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
