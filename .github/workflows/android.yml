name: Build Android APK

on:
  push:
    # signing-secrets: test build only (checks the signing secrets), no release
    branches: [main, 'ccr-*', 'signing-secrets']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # shown in the app's settings, so you can see which version is installed
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Write the signing key from the repository secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # copying on a phone often adds spaces or line breaks: drop them
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 - copy the whole long line again."
            exit 1
          fi
          echo "Keystore: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
      - name: Check the signing key and passwords
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias "${ALIAS:-alnai}" > /dev/null; then
            echo "::error::Keystore, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS do not match - check those secrets."
            exit 1
          fi
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias "${ALIAS:-alnai}" | grep "SHA256:"
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Notiva-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Notiva-apk
          path: Notiva-*.apk
      - name: Publish as GitHub release
        if: github.ref_name != 'signing-secrets'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="alnai-notes-v1.0.${{ github.run_number }}"
          gh release create "$TAG" Notiva-*.apk \
            --target "${{ github.sha }}" \
            --title "Notiva 1.0.${{ github.run_number }}" \
            --notes "APK für Android-Tablets (getestet für Lenovo Idea Tab Pro + Pen Plus). Herunterladen, öffnen, Installation aus unbekannten Quellen erlauben." \
            --latest
