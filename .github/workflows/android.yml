name: Android APK

on:
  push:
    paths:
      - "iptv-android-ecosystem/android-tv-client/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the APK (e.g. https://tv.example.com/)"
        required: false
        default: "http://10.0.2.2:8080/"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv-android-ecosystem/android-tv-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PauraApiBaseUrl="${{ github.event.inputs.api_base_url || 'http://10.0.2.2:8080/' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: aurastream-debug-apk
          path: iptv-android-ecosystem/android-tv-client/app/build/outputs/apk/debug/*.apk
